<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">                
    <title>Grid Areas</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .contenedor {    /* Contenedor principal con Grid */
        display: grid;
        grid-template-areas:
          "header header header"                       /* Fila 1: cabecera ocupa dos columnas */
          "sidebar main main"                          /* Fila 2: barra lateral + contenido */                       
          "footer footer footer";                      /* Fila 3: pie ocupa todo el ancho */
        grid-template-columns: 200px 1fr 1fr;       /* Tres columnas: fija + flexible + flexible */
        grid-template-rows: 80px 1fr 60px;      /* Alturas de las 3 filas respectivamente */
      }
        /* Cada área toma su posición mediante el nombre asignado */
      header { grid-area: header; background: #2c3e50; color: white; text-align: center; line-height: 80px; }
      /* El aside está con grid-row y grid-column como se pide */
      aside {
        grid-row: 2 / 4;
        grid-column: 1 / 2;
        background-color: #ecf0f1;
      }
      main   { grid-area: main; background: #f9f9f9; padding: 10px; }
      footer { grid-area: footer; background: #2c3e50; color: white; text-align: center; line-height: 60px; }

      /* El tamaño de los botones y su margen */
      button{
        width: 120px;
        height: 50px;
        margin: 10px;
      }

      /* El tamaño de cada columna y cada fila dentro del main (las imágenes), además de los pixeles de espacio entre ellas. Tabién las he centrado */ 
      main{
        display: grid;
        grid-template-columns: 300px 300px;
        grid-template-rows: 200px 200px 200px;
        grid-gap: 30px;
        justify-content: center;
      }

      /* Que las imágenes ocupen el tamaño completo de su columna y fila */
      img{
        width: 100%;
        height: 100%;
      }

      /* Versión responsive: reorganizamos las áreas en una sola columna */
      @media (max-width: 700px) {
        .contenedor {
          grid-template-areas:
            "header"
            "main"
            "sidebar"
            "footer";
          grid-template-columns: 1fr;
          grid-template-rows: 60px 1fr auto 50px;
        }
        /* Reinicia el aside para que se adapte al nuevo formato */
        aside {
          grid-row: auto;      
          grid-column: auto;
        }
        /* Reinicia el main para que se adapte al nuevo formato */
        main {
          grid-template-columns: 1fr; 
          grid-template-rows: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <header>Cabecera</header>
      <aside>
        Barra lateral
        <button>Pulsa abajo</button>
        <button>No hagas caso al primer botón</button>
      </aside>
      <main>
        <div>
          <img src="https://picsum.photos/300/600/?random">
        </div>
        <div>
          <img src="https://picsum.photos/600/300/?random">
        </div>
        <div>
          <img src="https://picsum.photos/200/200/?random">
        </div>
        <div>
          <img src="https://picsum.photos/200/500/?random">
        </div>
        <div>
          <img src="https://picsum.photos/200/400/?random">
        </div>
        <div>
          <img src="https://picsum.photos/200/250/?random">
        </div>        
      </main>
      <footer>Pie de página</footer>
    </div>
  </body>
</html>
